# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone (保持原始不变，仅替换C2f为C2f_EMA可选，此处先保留原始)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C2f_EMA, [128, True, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C2f_EMA, [256, True, 0.25]] # 4 (backbone P3特征)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C2f_EMA, [512, True]] # 6 (backbone P4特征)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C2f_EMA, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 (backbone P5特征)

# YOLO11n head (嵌入MS_SCEM模块)
head:
  # -------------------------- P4特征融合分支 --------------------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11 (上采样P5到P4尺寸)
  - [[-1, 6], 1, Concat, [1]] # 12 (拼接上采样P5 + backbone P4)
  - [-1, 2, C2f_EMA, [512, False]] # 13 (P4特征融合)
  - [-1, 1, MS_SCEM, [512]] # 14 【新增】P4尺度MS_SCEM特征增强

  # -------------------------- P3特征融合分支 --------------------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15 (上采样P4到P3尺寸)
  - [[-1, 4], 1, Concat, [1]] # 16 (拼接上采样P4 + backbone P3)
  - [-1, 2, C2f_EMA, [256, False]] # 17 (P3特征融合)
  - [-1, 1, MS_SCEM, [256]] # 18 【新增】P3尺度MS_SCEM特征增强 (Detect输入1)

  # -------------------------- P4下采样分支 --------------------------
  - [-1, 1, Conv, [256, 3, 2]] # 19 (下采样P3到P4尺寸)
  - [[-1, 14], 1, Concat, [1]] # 20 (拼接下采样P3 + 增强后的P4)
  - [-1, 2, C2f_EMA, [512, False]] # 21 (P4特征二次融合)
  - [-1, 1, MS_SCEM, [512]] # 22 【新增】P4尺度MS_SCEM二次特征增强 (Detect输入2)

  # -------------------------- P5下采样分支 --------------------------
  - [-1, 1, Conv, [512, 3, 2]] # 23 (下采样P4到P5尺寸)
  - [[-1, 10], 1, Concat, [1]] # 24 (拼接下采样P4 + backbone P5)
  - [-1, 2, C2f_EMA, [1024, True]] # 25 (P5特征融合)
  - [-1, 1, MS_SCEM, [1024]] # 26 【新增】P5尺度MS_SCEM特征增强 (Detect输入3)

  # -------------------------- Detect检测头 --------------------------
  - [[18, 22, 26], 1, Detect, [nc]] # 27 Detect(增强后的P3, P4, P5)